<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification — Mobile Service Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nirmala UI",Arial,sans-serif;background:linear-gradient(135deg,#1e1e2e,#181825);color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:480px;width:100%;background:#1e1e2e;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.header{background:linear-gradient(135deg,#a6e3a1,#89b4fa);padding:30px 22px;color:#1e1e2e;text-align:center}
.header .icon{font-size:52px;margin-bottom:10px}
.header h1{font-size:20px;margin-bottom:6px}
.header p{font-size:13px;opacity:.85}
.body{padding:26px 22px}
.email-box{background:#181825;padding:14px;border-radius:8px;color:#f9e2af;font-family:monospace;font-size:14px;margin-bottom:18px;border-left:4px solid #f9e2af;text-align:center;word-break:break-all}
.instructions{color:#a6adc8;font-size:13px;line-height:1.7;margin-bottom:18px;text-align:center}
.instructions b{color:#89b4fa}
.code-label{color:#a6adc8;font-size:12px;margin-bottom:8px;text-align:center;text-transform:uppercase;letter-spacing:1px}
.code-input{width:100%;background:#11111b;color:#89b4fa;border:2px solid #45475a;border-radius:10px;padding:18px;font-size:32px;font-weight:bold;font-family:monospace;text-align:center;letter-spacing:12px;outline:none;transition:.2s}
.code-input:focus{border-color:#89b4fa;box-shadow:0 0 0 3px rgba(137,180,250,.2)}
.verify-btn{background:linear-gradient(135deg,#a6e3a1,#89b4fa);color:#1e1e2e;border:none;padding:16px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;width:100%;margin-top:18px}
.verify-btn:hover{opacity:.9}
.verify-btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:rgba(243,139,168,.1);border-left:4px solid #f38ba8;color:#f38ba8;padding:12px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
.success{background:rgba(166,227,161,.1);border-left:4px solid #a6e3a1;color:#a6e3a1;padding:12px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
.back-link{display:block;text-align:center;margin-top:16px;color:#6c7086;font-size:12px;text-decoration:none}
.back-link:hover{color:#89b4fa}
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="icon">📧</div>
    <h1>Email Verification</h1>
    <p>কোড পাঠানো হয়েছে</p>
  </div>

  <div class="body">

    <div class="email-box">📧 {{ email }}</div>

    <div class="instructions">
      <b>Verification Code (OTP)</b> আপনার server terminal-এ print হয়েছে।<br>
      সেখান থেকে <b>৬-ডিজিটের</b> কোড দেখে নিয়ে type করুন।
    </div>

    <div class="code-label">🔢 6-digit Verification Code</div>

    <input type="text"
           id="otpInput"
           class="code-input"
           maxlength="6"
           placeholder="______"
           autocomplete="off"
           autofocus
           inputmode="numeric"
           pattern="[0-9]*">

    <button id="verifyBtn" class="verify-btn" onclick="verifyOTP()">
      ✅ Verify & Login
    </button>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <a href="/login" class="back-link">← অন্য email দিয়ে login করুন</a>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// OTP Verification
// ═══════════════════════════════════════════════════════════

const otpInput = document.getElementById('otpInput');
const verifyBtn = document.getElementById('verifyBtn');
const errorBox = document.getElementById('errorBox');
const successBox = document.getElementById('successBox');

// Auto-focus
otpInput.focus();

// Only digits allowed
otpInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) {
    // Auto-submit when 6 digits entered
    setTimeout(verifyOTP, 300);
  }
});

// Enter key submits
otpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    verifyOTP();
  }
});

async function verifyOTP() {
  const otp = otpInput.value.trim();

  // Hide old messages
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  if (otp.length !== 6) {
    errorBox.textContent = '⚠️ ৬-ডিজিটের OTP দিন';
    errorBox.style.display = 'block';
    return;
  }

  verifyBtn.disabled = true;
  verifyBtn.textContent = '⏳ Verifying...';

  try {
    console.log('[VERIFY] Sending OTP:', otp);

    const res = await fetch('/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({otp: otp})
    });

    const data = await res.json();
    console.log('[VERIFY] Response:', data);

    if (data.ok) {
      successBox.textContent = '✅ Verified! Redirecting to dashboard...';
      successBox.style.display = 'block';

      setTimeout(() => {
        window.location.href = '/dashboard-v2';
      }, 500);
    } else {
      errorBox.textContent = '❌ ' + (data.message || 'Verification failed');
      errorBox.style.display = 'block';
      verifyBtn.disabled = false;
      verifyBtn.textContent = '✅ Verify & Login';
      otpInput.select();
    }
  } catch (e) {
    console.error('[VERIFY] Error:', e);
    errorBox.textContent = '❌ Network error: ' + e.message;
    errorBox.style.display = 'block';
    verifyBtn.disabled = false;
    verifyBtn.textContent = '✅ Verify & Login';
  }
}

// Log for debugging
console.log('[VERIFY PAGE] Loaded. Ready for OTP input.');
</script>

</body>
</html>
