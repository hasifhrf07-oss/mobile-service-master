<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Legal Waiver — Mobile Service Master</title>
<style>
  body { font-family: "Nirmala UI", Arial; background: #1e1e2e; color: #e0e0e0; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: #181825; padding: 30px; border-radius: 12px; }
  h1 { color: #f9e2af; margin-bottom: 20px; }
  pre { background: #11111b; padding: 20px; border-radius: 8px; white-space: pre-wrap; color: #cdd6f4; font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; }
  input { width: 100%; background: #11111b; color: #cdd6f4; border: 1px solid #45475a; padding: 12px; border-radius: 8px; font-size: 16px; margin: 15px 0; }
  button { background: #a6e3a1; color: #1e1e2e; border: none; padding: 14px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .signed { background: rgba(166,227,161,0.15); border-left: 4px solid #a6e3a1; padding: 16px; border-radius: 8px; margin-bottom: 20px; color: #a6e3a1; }
</style>
</head>
<body>
<div class="container">
  <h1>⚖️ Legal Liability Waiver</h1>
  {% if signed %}
    <div class="signed">✅ Aapni already ei waiver sign korechen. Dhonyobad!</div>
    <a href="/dashboard-v2" style="color:#89b4fa;">→ Dashboard e jao</a>
  {% else %}
    <pre>{{ text }}</pre>
    <input type="text" id="sig" placeholder="Type your full name as signature">
    <button onclick="signIt()">✍️ Sign Waiver</button>
    <p style="color:#6c7086;font-size:12px;margin-top:15px;">IP address and timestamp will be recorded.</p>
  {% endif %}
</div>
<script>
async function signIt() {
  const sig = document.getElementById('sig').value.trim();
  if (!sig) { alert('Signature dao'); return; }
  const res = await fetch('/api/waiver/sign', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({signature: sig})
  });
  const data = await res.json();
  if (data.ok) {
    alert('✅ Waiver signed! Hash: ' + data.hash.substring(0,16) + '...');
    location.reload();
  } else {
    alert('Error: ' + (data.message || 'unknown'));
  }
}
</script>
</body>
</html>
