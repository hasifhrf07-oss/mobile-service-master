<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Waiver — Mobile Service Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nirmala UI",Arial,sans-serif;background:#1e1e2e;color:#e0e0e0;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{color:#89b4fa;font-size:20px;margin-bottom:16px}
.card{background:#181825;border-radius:12px;padding:20px;margin-bottom:16px}
pre{background:#11111b;padding:16px;border-radius:8px;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#cdd6f4}
button{background:#22c55e;color:#fff;border:0;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;margin-top:12px}
.status{padding:12px;border-radius:8px;margin-top:12px;font-size:13px;display:none}
.status.accepted{background:rgba(34,197,94,.15);color:#22c55e;display:block}
.back{color:#89b4fa;text-decoration:none;font-size:12px;display:inline-block;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
  <a href="/dashboard-v2" class="back">← Back</a>
  <h1>📝 Liability Waiver</h1>
  <div class="card">
    <pre id="waiverText">Loading...</pre>
    <button id="acceptBtn" onclick="acceptWaiver()">✅ I Accept</button>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
async function load(){
  const r = await fetch('/api/waiver/text').then(x=>x.json());
  if(r.ok) document.getElementById('waiverText').textContent = r.text;

  const s = await fetch('/api/waiver/status').then(x=>x.json());
  if(s.ok && s.accepted){
    document.getElementById('acceptBtn').style.display='none';
    const st = document.getElementById('status');
    st.className='status accepted';
    st.textContent='✅ Accepted on ' + (s.record?.accepted_at || '');
  }
}
async function acceptWaiver(){
  if(!confirm('আপনি কি এই waiver accept করেন?')) return;
  const r = await fetch('/api/waiver/accept',{method:'POST'}).then(x=>x.json());
  if(r.ok){
    document.getElementById('acceptBtn').style.display='none';
    const st = document.getElementById('status');
    st.className='status accepted';
    st.textContent='✅ Accepted! Signature: ' + r.signature;
  } else {
    alert('Error: ' + (r.message || 'Failed'));
  }
}
load();
</script>
</body>
</html>
