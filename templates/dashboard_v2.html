<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MSM PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b1120; color: #e2e8f0; overflow: hidden; height: 100vh; margin: 0; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; }
        .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.05); }
        @keyframes scan { 0% { top: 0%; opacity: 1; } 50% { top: 100%; opacity: 1; } 100% { top: 0%; opacity: 1; } }
        .laser { position: absolute; left: 0; right: 0; height: 3px; background: #0ea5e9; box-shadow: 0 0 20px #0ea5e9; display: none; z-index: 50; animation: scan 2s infinite linear; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <!-- SIDEBAR -->
    <div class="w-16 bg-[#111827] border-r border-slate-800 flex flex-col items-center py-4 gap-4 shrink-0 z-20">
        <i class="fas fa-mobile-screen text-sky-400 text-xl mb-4"></i>
        <a href="#" onclick="showView('dashboard')" class="text-sky-400 p-2 bg-sky-900/30 rounded"><i class="fas fa-home text-xl"></i></a>
        <a href="#" onclick="showView('chat')" class="text-slate-400 hover:text-purple-400 p-2"><i class="fas fa-robot text-xl"></i></a>
        <a href="#" onclick="showView('settings')" class="text-slate-400 hover:text-red-400 p-2 mt-auto"><i class="fas fa-user-shield text-xl"></i></a>
    </div>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div class="h-14 bg-[#111827] border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
            <h1 class="text-lg font-bold text-white">MSM <span class="text-sky-400">PRO</span></h1>
            <div class="text-sm font-bold text-green-400"><i class="fas fa-database mr-1"></i> <span id="totalModels">0</span> Models</div>
        </div>

        <!-- DASHBOARD -->
        <div id="view-dashboard" class="flex-1 flex p-4 gap-4 overflow-hidden">
            <!-- BRANDS -->
            <div class="w-48 glass rounded-xl flex flex-col overflow-hidden">
                <div class="p-2 border-b border-slate-700 text-xs font-bold text-sky-400 bg-slate-800">Brands</div>
                <div id="brandList" class="flex-1 overflow-y-auto p-1 space-y-1"></div>
            </div>
            <!-- DEVICES -->
            <div class="flex-1 glass rounded-xl flex flex-col overflow-hidden">
                <div class="p-2 border-b border-slate-700 text-xs font-bold text-white bg-slate-800" id="brandTitle">Select Brand</div>
                <div id="deviceList" class="flex-1 overflow-y-auto p-2 grid grid-cols-2 gap-2"></div>
            </div>
            <!-- TOOLS -->
            <div class="w-64 glass rounded-xl flex flex-col overflow-hidden">
                <div class="p-2 border-b border-slate-700 text-xs font-bold text-purple-400 bg-slate-800"><i class="fas fa-tools mr-1"></i> Tools</div>
                <div class="p-2 flex flex-col flex-1 overflow-hidden">
                    <div class="grid grid-cols-3 gap-1 mb-2">
                        <button onclick="runTool('connect')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-plug text-sky-400 mb-1"></i><br>Connect</button>
                        <button onclick="runTool('backup')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-cloud-arrow-up text-green-400 mb-1"></i><br>Backup</button>
                        <button onclick="runTool('bypass')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-unlock text-red-400 mb-1"></i><br>Bypass</button>
                        <button onclick="runTool('analyzer')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-microchip text-blue-400 mb-1"></i><br>Analyzer</button>
                        <button onclick="runTool('meter')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-gauge-high text-orange-400 mb-1"></i><br>Meter</button>
                        <button onclick="runTool('wipe')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-eraser text-yellow-400 mb-1"></i><br>Wipe</button>
                        <button onclick="runTool('solve')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-robot text-pink-400 mb-1"></i><br>Solve</button>
                        <button onclick="runTool('diagnose')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-stethoscope text-teal-400 mb-1"></i><br>Diagnose</button>
                        <button onclick="runTool('direction')" class="bg-slate-800 p-1 rounded text-[9px] hover:bg-slate-700"><i class="fas fa-map-signs text-purple-400 mb-1"></i><br>Direction</button>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1"><span id="pText">Ready</span><span id="pPct">0%</span></div>
                    <div class="w-full bg-slate-800 rounded h-1.5 mb-2"><div id="pBar" class="bg-sky-500 h-1.5 rounded" style="width:0%"></div></div>
                    <div id="terminal" class="bg-black/50 p-2 rounded flex-1 overflow-y-auto font-mono text-[10px] text-green-400"><p class="text-slate-500">> Waiting...</p></div>
                </div>
            </div>
        </div>

        <!-- DIAGNOSTIC VIEW -->
        <div id="view-diag" class="hidden flex-1 flex-col p-4 gap-4 bg-[#0f172a]">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-sky-400"><i class="fas fa-microchip mr-2"></i>Hardware Diagnostic</h2>
                <button onclick="showView('dashboard')" class="bg-slate-700 px-4 py-1 rounded text-sm">Back</button>
            </div>
            <div class="grid grid-cols-3 gap-4 flex-1 overflow-hidden">
                <div class="glass rounded-xl flex flex-col relative overflow-hidden">
                    <div class="p-2 text-xs font-bold bg-slate-800">Board Scanner</div>
                    <div class="flex-1 relative flex items-center justify-center bg-black">
                        <div class="laser" id="laser"></div>
                        <img id="boardImg" src="" class="max-h-full max-w-full hidden">
                        <div id="imgPlaceholder" class="text-xs text-slate-500">No Image</div>
                    </div>
                </div>
                <div class="glass rounded-xl flex flex-col overflow-hidden">
                    <div class="p-2 text-xs font-bold bg-slate-800 text-yellow-400">Live Voltages</div>
                    <div id="vGrid" class="p-2 space-y-2 overflow-y-auto flex-1"></div>
                </div>
                <div class="glass rounded-xl flex flex-col overflow-hidden">
                    <div class="p-2 text-xs font-bold bg-slate-800 text-green-400">AI Solution</div>
                    <div class="p-2 overflow-y-auto flex-1 text-xs text-green-400 font-mono" id="aiText">Scanning...</div>
                </div>
            </div>
        </div>

        <!-- AI CHAT VIEW -->
        <div id="view-chat" class="hidden flex-1 flex-col bg-[#0f172a] p-4">
            <h2 class="text-lg font-bold text-purple-400 mb-2">AI Assistant</h2>
            <div class="flex-1 glass rounded-xl p-4 overflow-y-auto flex flex-col gap-2">
                <div class="bg-slate-800 p-2 rounded text-sm self-start">Hello Admin. How can I help?</div>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="view-settings" class="hidden flex-1 flex-col bg-[#0f172a] p-4">
            <h2 class="text-lg font-bold text-red-400 mb-2">Admin Settings</h2>
            <div class="glass p-4 rounded-xl">Settings locked.</div>
        </div>

    </div>

    <script>
        let vInterval = null;

        fetch('/api/total-models').then(r=>r.json()).then(d=>document.getElementById('totalModels').innerText=d.total);
        fetch('/api/get_brands').then(r=>r.json()).then(d=>{
            let html = '';
            d.forEach(b=>{ html += `<div onclick="loadDev('${b.brand_name}')" class="p-1.5 text-xs cursor-pointer hover:bg-slate-700 rounded text-slate-300"><span class="text-yellow-500 mr-1">#${b.rank}</span>${b.brand_name}</div>`; });
            document.getElementById('brandList').innerHTML = html;
        });

        function loadDev(brand) {
            document.getElementById('brandTitle').innerText = brand;
            document.getElementById('deviceList').innerHTML = '<div class="col-span-2 text-center text-sky-500"><i class="fas fa-spinner fa-spin"></i></div>';
            fetch(`/api/get_devices/${brand}`).then(r=>r.json()).then(d=>{
                let html = '';
                d.forEach(dev=>{ html += `<div onclick="openDiag('${dev.model}')" class="bg-slate-800 p-2 rounded cursor-pointer hover:border-sky-500 border border-slate-700"><div class="text-[9px] text-sky-400">${dev.year}</div><div class="text-xs font-bold text-white">${dev.model}</div></div>`; });
                document.getElementById('deviceList').innerHTML = html || 'No devices';
            });
        }

        function showView(v) {
            ['dashboard','diag','chat','settings'].forEach(x=>document.getElementById('view-'+x).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            if(v !== 'diag' && vInterval) { clearInterval(vInterval); vInterval = null; }
        }

        function openDiag(model) {
            showView('diag');
            document.getElementById('laser').style.display = 'block';
            document.getElementById('boardImg').classList.add('hidden');
            document.getElementById('imgPlaceholder').classList.remove('hidden');
            
            // ইমেজ লোড
            setTimeout(()=>{
                document.getElementById('boardImg').src = "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=500&q=80";
                document.getElementById('boardImg').classList.remove('hidden');
                document.getElementById('laser').style.display = 'none';
                document.getElementById('imgPlaceholder').classList.add('hidden');
            }, 2000);

            // ভোল্টেজ আপডেট
            const ics = [{n:"PMIC",k:"PMIC"},{n:"CPU",k:"CPU"},{n:"NAND",k:"NAND"},{n:"WiFi",k:"WiFi"},{n:"Display",k:"Display"}];
            let vHtml = '';
            ics.forEach(ic=>{ vHtml += `<div class="bg-slate-800 p-2 rounded mb-1 flex justify-between items-center"><span class="text-xs text-white">${ic.n}</span><span class="text-sm font-bold text-green-400" id="v-${ic.k}">0.00 V</span></div>`; });
            document.getElementById('vGrid').innerHTML = vHtml;

            if(vInterval) clearInterval(vInterval);
            const upV = () => {
                fetch('/api/live-voltages').then(r=>r.json()).then(d=>{
                    ics.forEach(ic=>{ if(d[ic.k]) document.getElementById('v-'+ic.k).innerText = d[ic.k] + ' V'; });
                });
            };
            upV(); vInterval = setInterval(upV, 1000);

            document.getElementById('aiText').innerText = "=== REPORT ===
[1] CPU: 95%
[2] RAM: 88%
[3] Battery: 77%

=== SOLUTION ===
All ICs working. Battery needs replacement.";
        }

        async function runTool(tool) {
            const term = document.getElementById('terminal');
            const bar = document.getElementById('pBar');
            const pct = document.getElementById('pPct');
            term.innerHTML = '<p class="text-yellow-400">> Connecting...</p>';
            bar.style.width = '0%'; pct.innerText = '0%';
            
            const res = await fetch(`/api/tools/${tool}`, { method: 'POST' });
            const data = await res.json();
            term.innerHTML = '';
            let i = 0;
            function step() {
                if(i < data.steps.length) {
                    let s = data.steps[i];
                    bar.style.width = s.progress+'%'; pct.innerText = s.progress+'%';
                    term.innerHTML += `<p class="text-green-400">> ${s.text}</p>`;
                    i++; setTimeout(step, 600);
                }
            }
            step();
        }
    </script>
</body>
</html>
